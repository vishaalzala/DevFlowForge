<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-label="SEOForge identifies website search issues; DevFlowForge guides implementation and verification"><rect width="1200" height="390" rx="25" fill="#101a32"/><text x="50" y="61" fill="white" font-family="Arial" font-size="30" font-weight="bold">Two focused toolkits. One clear workflow.</text><g font-family="Arial"><rect x="55" y="114" width="445" height="189" rx="22" fill="#164a5d"/><text x="85" y="165" fill="#8ce6cb" font-size="30" font-weight="bold">SEOForge</text><text x="85" y="207" fill="white" font-size="19">Audit pages and identify evidence</text><text x="85" y="245" fill="#b7dbe3" font-size="17">Prioritised issue and acceptance check</text><path d="M510 208h160" stroke="#7dd6c8" stroke-width="5"/><path d="m655 193 20 15-20 15" fill="none" stroke="#7dd6c8" stroke-width="5"/><rect x="684" y="114" width="445" height="189" rx="22" fill="#3c3e75"/><text x="715" y="165" fill="#c2bafd" font-size="30" font-weight="bold">DevFlowForge</text><text x="715" y="207" fill="white" font-size="19">Plan the change and implement it</text><text x="715" y="245" fill="#c7cbeb" font-size="17">Test, review and verify the result</text><text x="55" y="350" fill="#9db9ce" font-size="17">ChatGPT coordinates the handoff when both plugins and the required project tools are available.</text></g></svg>