name: Validate plugin
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_plugin.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix tools/website-qa-auditor test
      - name: Install browser QA dependencies
        run: npm --prefix tools/website-qa-auditor install --ignore-scripts
      - name: Install Chromium for local fixture smoke
        run: cd tools/website-qa-auditor && npx playwright install --with-deps chromium
      - name: Exercise QA CLI against local fixture
        run: node tools/website-qa-auditor/tests/browser-smoke.mjs
      - name: Design intelligence policy and comparison tests
        run: npm --prefix tools/design-intelligence test
      - name: Install design intelligence dependencies
        run: npm --prefix tools/design-intelligence install --ignore-scripts
      - name: Exercise design preservation browser smoke against local fixture
        run: node tools/design-intelligence/tests/browser-smoke.mjs
      - name: Skill-evaluation deterministic unit tests
        run: npm --prefix tools/skill-evaluator test
      - name: Consolidated QA reporting unit tests
        run: npm --prefix tools/qa-report-aggregator test
      - name: Validate sample skill-evaluation CLI report
        run: node tools/skill-evaluator/src/cli.mjs --input tools/skill-evaluator/examples/fixtures.json --out /tmp/devflowforge-skill-evaluation
